<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach CTI - Cyber Threat Intelligence</title>
  <meta name="description" content="Threat intelligence platform: IP verdicts, classified threat reports, MongoDB schema and cache labs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7L16 2Z' fill='%23ffb000'/%3E%3Cpath d='M16 9v14M10 14h12' stroke='%23111a22' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    try { const t = localStorage.getItem("kavach-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-feed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-ip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></symbol>
    <symbol id="i-classify" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h7M4 17h5"/><path d="m14 15 3 3 5-6"/></symbol>
    <symbol id="i-sources" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19a14 14 0 0 1 14-14M5 12a7 7 0 0 1 7-7"/><circle cx="6" cy="18" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-schema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="4" width="7" height="6" rx="1.5"/><rect x="8.5" y="14" width="7" height="6" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/></symbol>
    <symbol id="i-cache" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-4 3 2 4-5"/></symbol>
    <symbol id="i-usecases" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="rail" id="rail">
    <a class="brand" href="#/overview" aria-label="Kavach CTI home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7L16 2Z" fill="var(--accent)"/><path d="M16 9v14M10 14h12" stroke="var(--bg)" stroke-width="3" stroke-linecap="round"/></svg>
      <span><span class="brand-name">Kavach</span><span class="brand-sub">Cyber threat intelligence</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/overview" data-route="overview"><svg><use href="#i-overview"/></svg>Overview</a>
      <a href="#/threats" data-route="threats"><svg><use href="#i-feed"/></svg>Threat feed</a>
      <a href="#/ip" data-route="ip"><svg><use href="#i-ip"/></svg>IP intelligence</a>
      <a href="#/classify" data-route="classify"><svg><use href="#i-classify"/></svg>Classifier</a>
      <a href="#/sources" data-route="sources"><svg><use href="#i-sources"/></svg>Sources</a>
      <div class="nav-group">MongoDB labs</div>
      <a href="#/lab71" data-route="lab71"><svg><use href="#i-schema"/></svg>Schema lab 7.1</a>
      <a href="#/lab72" data-route="lab72"><svg><use href="#i-cache"/></svg>Cache lab 7.2</a>
      <a href="#/usecases" data-route="usecases"><svg><use href="#i-usecases"/></svg>Use cases</a>
    </nav>
    <div class="rail-foot">
      <div class="db-state" id="db-state"><span class="dot"></span><span>Checking MongoDB</span></div>
      <div class="db-state" id="sync-state"><span class="dot"></span><span>Live sync starting</span></div>
      <button class="theme-btn" id="theme-btn" type="button"><svg width="15" height="15"><use href="#i-sun"/></svg><span>Light theme</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open menu"><svg width="20" height="20"><use href="#i-menu"/></svg></button>
      <form class="omni" id="omni" role="search" autocomplete="off">
        <svg class="icon"><use href="#i-search"/></svg>
        <label class="sr-only" for="omni-input">Check an IP, search reports or look up a CVE</label>
        <input id="omni-input" type="search" placeholder="Check an IP, search threat reports, or paste a CVE" spellcheck="false">
        <span class="hint"><span class="omni-type" id="omni-type" hidden></span><span class="kbd" id="kbd-hint">Ctrl K</span></span>
      </form>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <div id="banner-slot"></div>
    <main class="page" id="page" tabindex="-1"></main>
  </div>
</div>
<div id="drawer-slot"></div>
<div id="toast-slot" aria-live="polite"></div>

<script src="assets/worldmask.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
